<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CUA Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 12px; font-size: 14px; line-height: 1.5; }
  #log div { margin-bottom: 4px; }
  .msg { color: #6a9955; }
  .action { color: #569cd6; }
  .done { color: #dcdcaa; font-weight: bold; }
  .error { color: #f44747; }
  .cancelled { color: #ce9178; }
  .ready { color: #808080; }
  #bar { display: flex; gap: 8px; padding: 12px; background: #252526; border-top: 1px solid #333; }
  #input { flex: 1; padding: 8px 12px; font-family: monospace; font-size: 14px; background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; border-radius: 4px; }
  #input:focus { outline: none; border-color: #007acc; }
  button { padding: 8px 16px; font-family: monospace; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
  #send { background: #007acc; color: #fff; }
  #send:hover { background: #005f99; }
  #cancel { background: #c53534; color: #fff; }
  #cancel:hover { background: #a02020; }
  #status { padding: 4px 12px; font-size: 12px; background: #333; color: #808080; }
</style>
</head>
<body>
<div id="status">Disconnected</div>
<div id="log"></div>
<div id="bar">
  <input id="input" placeholder="Enter a task..." autofocus />
  <button id="send">Send</button>
  <button id="cancel">Cancel</button>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const cancelBtn = document.getElementById('cancel');
const status = document.getElementById('status');

let ws;

function append(cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function connect() {
  status.textContent = 'Connecting...';
  ws = new WebSocket('ws://localhost:8765');

  ws.onopen = () => { status.textContent = 'Connected'; };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'ready':     append('ready', '--- Ready for tasks ---'); break;
      case 'message':   append('msg', msg.text); break;
      case 'action':    append('action', '[action] ' + JSON.stringify(msg.detail)); break;
      case 'done':      append('done', '--- ' + (msg.summary || 'Done') + ' ---'); break;
      case 'error':     append('error', '[error] ' + msg.message); break;
      case 'cancelled': append('cancelled', '[cancelled] ' + msg.message); break;
      default:          append('ready', JSON.stringify(msg));
    }
  };

  ws.onclose = () => {
    status.textContent = 'Disconnected — reconnecting in 3s...';
    setTimeout(connect, 3000);
  };

  ws.onerror = () => { ws.close(); };
}

function sendTask() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'task', content: text }));
  append('ready', '>>> ' + text);
  input.value = '';
}

sendBtn.onclick = sendTask;
cancelBtn.onclick = () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'cancel' }));
    append('cancelled', '>>> /cancel');
  }
};
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendTask(); });

connect();
</script>
</body>
</html>
